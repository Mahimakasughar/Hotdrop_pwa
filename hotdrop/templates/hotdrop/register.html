{% load static %}
{% include 'hotdrop/navbar.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | HotDrop Kitchen</title>
  <link rel="stylesheet" href="{% static 'hotdrop/css/style.css' %}" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
    }

    .breadcrumb {
      background-color: #fff;
      padding: 10px 40px;
      font-size: 14px;
      color: #777;
      border-bottom: 1px solid #ddd;
    }

    .breadcrumb a {
      color: #ff4d4d;
      text-decoration: none;
    }

    .register-container {
      width: 90%;
      max-width: 1200px;
      margin: 40px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 40px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 20px;
    }

    .register-left {
      flex: 1.2;
      min-width: 300px;
    }

    .register-left h2 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 25px;
    }

    form input, form select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    form input:focus, form select:focus {
      border-color: #ff4d4d;
    }

    .form-actions {
      grid-column: span 2;
      text-align: left;
      margin-top: 10px;
    }

    .btn-register {
      background-color: #ff4d4d;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-register:hover {
      background-color: #e33b3b;
    }

    .register-right {
      flex: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      
    }

    .register-right img {
      width: 100%;
      height: 300px;
      border-radius: 10px;
    }

    @media (max-width: 992px) {
      form {
        grid-template-columns: 1fr;
      }

      .register-container {
        flex-direction: column;
      }

      .register-right img {
        max-width: 80%;
      }
    }
  </style>
</head>
<body>

  <div class="breadcrumb">
    <a href="{% url 'home' %}">Home</a> / User Registration Page
  </div>

  <div class="register-container">
    <div class="register-left">
      <h2>USER REGISTRATION PAGE</h2>

      <form>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email ID" required>

        <input type="password" placeholder="Password" required>
        <input type="password" placeholder="Confirm Password" required>

        <input type="text" placeholder="Contact Number" required>
        <input type="date" placeholder="Date of Birth">

        <input type="text" placeholder="Address Line 1">
        <input type="text" placeholder="Address Line 2">

        <select>
          <option value="">Select City</option>
          <option value="Mumbai">Mumbai</option>
          <option value="Delhi">Delhi</option>
          <option value="Chennai">Chennai</option>
          <option value="Bangalore">Bangalore</option>
        </select>

        <select>
          <option value="">Select State</option>
          <option value="Maharashtra">Maharashtra</option>
          <option value="Tamil Nadu">Tamil Nadu</option>
          <option value="Karnataka">Karnataka</option>
          <option value="Delhi">Delhi</option>
        </select>

        <select>
          <option value="">Select Country</option>
          <option value="India">India</option>
          <option value="USA">USA</option>
          <option value="UK">UK</option>
        </select>

        <input type="file" accept="image/*">

        <div class="form-actions">
          <button type="submit" class="btn-register">Register</button>
        </div>
      </form>
    </div>

    <div class="register-right">
      <img src="{% static 'hotdrop/img/register-illustration.jpg' %}" alt="Registration Image">
    </div>
  </div>

  {% include 'hotdrop/footer.html' %}
</body>
</html>
