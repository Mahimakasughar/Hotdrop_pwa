{% load static %}
{% include 'hotdrop/navbar.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HotDrop Kitchen</title>
    <link rel="stylesheet" href="{% static 'hotdrop/css/style.css' %}">
    <style>
        body {
            background-color: #f6f6f6;
            font-family: 'Poppins', sans-serif;
        }

        .breadcrumb {
            margin: 20px 50px;
            font-size: 14px;
            color: gray;
        }

        .login-section {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 50px;
            background: #fff;
            margin: 30px auto;
            width: 80%;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        .login-box {
            flex: 1;
            padding: 30px;
        }

        .login-box h2 {
            font-weight: 700;
            margin-bottom: 25px;
            color: #333;
        }

        .login-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .login-box input:focus {
            border-color: #ff4b4b;
        }

        .login-box .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
        }

        .login-box .btn-login {
            background-color: #ff4b4b;
            color: #fff;
            margin-right: 10px;
        }

        .login-box .btn-reset {
            background-color: #ddd;
            color: #333;
        }

        .login-box p {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
        }

        .login-box a {
            color: #ff4b4b;
            text-decoration: none;
            font-weight: 600;
        }

        .login-box a:hover {
            text-decoration: underline;
        }

        .login-image {
            flex: 1;
            text-align: center;
        }

        .login-image img {
            width: 50%;
            border-radius: 10px;
        }

        @media (max-width: 900px) {
            .login-section {
                flex-direction: column;
                width: 90%;
            }

            .login-image img {
                width: 60%;
            }
        }
    </style>
</head>
<body>

    <div class="breadcrumb">
        Home / <span style="color: black;">Login</span>
    </div>

    <section class="login-section">
        <div class="login-box">
            <h2>LOGIN TO YOUR ACCOUNT</h2>
            <form>
                <label>Email address</label>
                <input type="email" placeholder="admin@gmail.com" required>

                <label>Password</label>
                <input type="password" placeholder="••••••••" required>

                <button type="submit" class="btn btn-login">Login to Account</button>
                <button type="reset" class="btn btn-reset">Reset Form</button>

                <p>Don’t have an account? 
                    <a href="{% url 'register' %}">Click here</a> to register.
                </p>
            </form>
        </div>

        <div class="login-image">
            <img src="{% static 'hotdrop/img/login.jpg' %}" alt="Login Illustration">
        </div>
    </section>
{% include 'hotdrop/footer.html' %}
</body>
</html>
