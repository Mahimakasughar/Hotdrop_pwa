{% load static %}
{% include 'hotdrop/navbar.html' %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ product.name }} | HotDrop Kitchen</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f8f8f8;
      margin: 0;
      padding: 0;
    }

    .product-detail-container {
      width: 90%;
      max-width: 1000px;
      margin: 50px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-wrap: wrap;
      overflow: hidden;
    }

    .product-image {
      flex: 1;
      min-width: 300px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      flex: 1;
      padding: 30px;
    }

    .product-info h2 {
      color: #333;
      font-size: 26px;
      margin-bottom: 10px;
    }

    .product-info p {
      font-size: 16px;
      color: #666;
      margin-bottom: 10px;
    }

    .price {
      color: #ff4d4d;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .quantity {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .quantity button {
      background-color: #ff4d4d;
      color: white;
      border: none;
      width: 35px;
      height: 35px;
      font-size: 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    .quantity input {
      width: 50px;
      text-align: center;
      margin: 0 10px;
      font-size: 16px;
    }

    .btn {
      display: inline-block;
      background-color: #ff4d4d;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #e63946;
    }
  </style>
</head>
<body>

  <div class="product-detail-container">
    <div class="product-image">
      <img src="{% static product.image %}" alt="{{ product.name }}">
    </div>
    <div class="product-info">
      <h2>{{ product.name }}</h2>
      <p><strong>Category:</strong> {{ product.type }}</p>
      <p class="price">₹ {{ product.price }}</p>

      <div class="quantity">
        <button id="decrease">-</button>
        <input type="text" id="quantity" value="1" readonly>
        <button id="increase">+</button>
      </div>

     <a href="{% url 'add_to_cart' product.id %}" class="btn btn-danger mt-3">
    Add to Cart
</a>
    </div>
  </div>


  {% include 'hotdrop/footer.html' %}

  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const decreaseBtn = document.getElementById("decrease");
    const increaseBtn = document.getElementById("increase");
    const quantityInput = document.getElementById("quantity");

    increaseBtn.addEventListener("click", () => {
      let value = parseInt(quantityInput.value);
      quantityInput.value = value + 1;
    });

    decreaseBtn.addEventListener("click", () => {
      let value = parseInt(quantityInput.value);
      if (value > 1) {
        quantityInput.value = value - 1;
      }
    });
  });
  </script>
</body>
</html>
