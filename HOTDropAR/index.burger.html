<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>HotDrop AR</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        model-viewer {
            width: 100%;
            height: 500px;
            background: #eeeeee;
        }

        .info {
            padding: 15px;
            background: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍔 HotDrop AR</h1>

    <div class="info">
        <h2>Cheese Burst Pizza</h2>
        <p>₹400</p>
        <p>View this product in your real environment.</p>
    </div>

    <model-viewer
    src="models/burger.glb"
    alt="3D model of HotDrop Burger"
    ar
    ar-modes="quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1">

    <button slot="ar-button">
        🥽 View Burger in AR
    </button>

</model-viewer>

</div>

</body>
</html>
